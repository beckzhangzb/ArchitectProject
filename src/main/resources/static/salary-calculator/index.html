<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时工资计算器 - 金色财富</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 实时工资计算器 💰</h1>
            <p class="subtitle">金色财富，秒秒增值</p>
        </header>
        
        <div class="input-section">
            <h2>请输入您的薪资信息</h2>
            
            <div class="form-group">
                <label for="monthlySalary">月薪 (¥)</label>
                <input type="number" id="monthlySalary" placeholder="例如：15000" value="15000">
            </div>
            
            <div class="form-group">
                <label for="workHours">每日工作小时数</label>
                <input type="number" id="workHours" placeholder="例如：8" value="8">
            </div>
            
            <div class="form-group">
                <label for="workDays">每月工作天数</label>
                <input type="number" id="workDays" placeholder="例如：22" value="22">
            </div>
            
            <button id="startBtn" class="golden-btn">开始计算</button>
            <button id="resetBtn" class="reset-btn">重置</button>
        </div>
        
        <div class="result-section">
            <div class="money-display">
                <div class="money-label">当前累计收入</div>
                <div class="money-value" id="moneyValue">¥0.00</div>
                <div class="money-per-second" id="perSecond">+¥0.00/秒</div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalSeconds">0</div>
                    <div class="stat-label">已运行秒数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="coinCount">0</div>
                    <div class="stat-label">金币总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="goldEarned">0</div>
                    <div class="stat-label">金色财富</div>
                </div>
            </div>
        </div>
        
        <div class="coin-container" id="coinContainer"></div>
        
        <div class="footer">
            <p>✨ 每当金额达到10的倍数时，金色金币将华丽掉落！ ✨</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
