<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchitectProject - 主页</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50, #4a6491);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            padding: 20px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #FFA500;
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .feature h3 {
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        .btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #1a1a1a;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }
        
        .footer {
            margin-top: 40px;
            font-size: 1rem;
            color: #FFD700;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 ArchitectProject 💰</h1>
        <p class="subtitle">专业架构师项目</p>
        
        <div class="features">
            <div class="feature">
                <h3>实时工资计算器</h3>
                <p>金色财富，秒秒增值</p>
            </div>
            <div class="feature">
                <h3>优雅设计</h3>
                <p>华丽动效，极致体验</p>
            </div>
            <div class="feature">
                <h3>响应式</h3>
                <p>适配所有设备</p>
            </div>
        </div>
        
        <button onclick="window.location.href='/salary-calculator/index.html'" class="btn">启动工资计算器</button>
        
        <p class="footer">✨ 点击按钮开始您的金色财富之旅 ✨</p>
    </div>
</body>
</html>
